<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photonic - pose overlay over video demo</title>
<style>
  html, body { margin: 0; font-family: system-ui, sans-serif; background: #111827; color: #e5e7eb; }
  header { display: flex; gap: 16px; align-items: center; padding: 10px 14px; flex-wrap: wrap; }
  #stage { position: relative; width: min(960px, 100vw); aspect-ratio: 16 / 9; margin: 0 auto; background: #000; overflow: hidden; }
  #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  label { font-size: 14px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../../node_modules/three/build/three.module.js",
    "three/addons/": "../../node_modules/three/examples/jsm/",
    "three/examples/jsm/": "../../node_modules/three/examples/jsm/",
    "@sparkjsdev/spark": "../../node_modules/@sparkjsdev/spark/dist/spark.module.js"
  }
}
</script>
</head>
<body>
<header>
  <strong>Photonic pose overlay over video (F1 demo)</strong>
  <label><input type="checkbox" id="toggle-arrows" checked> Offset arrows</label>
  <label><input type="checkbox" id="toggle-deviation" checked> Color by deviation</label>
</header>
<div id="stage">
  <video id="stage-video" autoplay muted playsinline></video>
</div>
<script type="module" src="./overlay-demo.js"></script>
</body>
</html>
